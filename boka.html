<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boka tid</title>
  <link rel="stylesheet" href="boka.css">
  <script src="boka.js" defer></script>
</head>

<body>
  <header class="site">
    <h1>Boka Tandläkar tid</h1>

    <p class="lead">Välj en ledig tid i schemat och skriv ditt namn.</p>

      <div class="head">Fre</div>

      <!-- 08:00 -->
      <div class="time">08:00</div>
      <button class="slot" type="button" id="man-08:00" data-dag="Måndag" data-tid="08:00">Ledig</button>
      <button class="slot" type="button" id="tis-08:00" data-dag="Tisdag" data-tid="08:00">Ledig</button>
