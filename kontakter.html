<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakta oss</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="kontakter.css">
</head>
<body>
    <header>

        <div class="headerNavBox">
                <img src="images/smile-smiling-lips-png-transparent-smiling-lips-images-35.png">
                <nav>
                    <a href="boka.html">
                        <button id="boka">Boka</button>
                    </a>
                    <a href="bokade_tider.html">
                        <button id="bokade">Bokade</button>
                    </a>
                    <a href="kontakter.html">
                        <button id="kontakt">Kontakt</button>
                    </a>
                    <a href="">
                        <button id="om-oss">Om oss</button>
                    </a>
                </nav>
            </div>
    </header>
    <section id="contact-section">
        <div class="contact-container">
            <h2>Kontakta oss</h2>
            <p class="contact-description">
                Har du frågor om att boka eller avboka tider?
                Hör av dig till oss!
            </p>
          
            <div class="contact-info">
                <div class="info-item">
                    <h3>📞 Telefon</h3>
                    <p>
                        <a href="tel:+46833245789">
                            08-332 457 89
                        </a>
                    </p>
                </div>
                <div class="info-item">
                    <h3>✉️ E-post</h3>
                    <p>
                        <a href="mailto:info@example.se">
                            info@example.se
                        </a>
                    </p>
                </div>
                <div class="info-item">
                    <h3>🕒 Våra öppettider</h3>
                    <p>Måndag–fredag: 08:00–16:00</p>
                    <p>Lördag–söndag: Stängt</p>
                </div>
            </div>
        
            <h3 class="form-title">Skicka ett meddelande</h3>
            <form id="contact-form">
                <div class="form-group">
                    <label for="contact-name">Ditt namn:</label>
                    <input
                        type="text"
                        id="contact-name"
                        name="name"
                        placeholder="Skriv ditt namn..."
                        autocomplete="name"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="contact-email">Din e-post:</label>
                    <input
                        type="email"
                        id="contact-email"
                        name="email"
                        placeholder="namn@exempel.se"
                        autocomplete="email"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="contact-message">Meddelande:</label>
                    <textarea
                        id="contact-message"
                        name="message"
                        rows="5"
                        placeholder="Skriv ditt meddelande här..."
                        required
                    ></textarea>
                </div>
                <button type="submit" class="submit-btn">
                    Skicka meddelande
                </button>
            </form>
        </div>
    </section>
</body>
</html>
